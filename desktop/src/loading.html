<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>language-tutor</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        font:
          15px/1.5 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        color: #3d3d4e;
        background: #f7f7fb;
      }

      @media (prefers-color-scheme: dark) {
        body {
          color: #d7d7e4;
          background: #1c1c24;
        }
      }

      .spinner {
        width: 34px;
        height: 34px;
        border: 3px solid currentColor;
        border-right-color: transparent;
        border-radius: 50%;
        opacity: 0.45;
        animation: spin 900ms linear infinite;
      }

      .hint {
        opacity: 0.6;
        font-size: 13px;
        max-width: 34ch;
        text-align: center;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation-duration: 3s;
        }
      }
    </style>
  </head>
  <body>
    <div class="spinner"></div>
    <div>Запускаем приложение…</div>
    <p class="hint">
      Первый запуск дольше обычного: в память загружается модель распознавания речи.
    </p>
  </body>
</html>
